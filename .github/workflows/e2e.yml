name: End-to-End ML Pipeline

on:
  push:
    branches: [main]

# Für den Push ins GHCR (wie bei Tag 10/11)
permissions:
  contents: read
  packages: write

jobs:
  train-and-deploy:
    runs-on: self-hosted
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      # pyproject.toml-Variante (nach uv init): uv legt die venv selbst als
      # .venv im Arbeitsordner an und installiert exakt nach uv.lock.
      - name: Abhängigkeiten installieren
        run: uv sync --locked

      # data/iris.csv steht in der .gitignore (Tag 9) - im frischen Checkout
      # fehlt die Datei, nur data/iris.csv.dvc ist in Git. DVC holt sie aus MinIO.
      - name: Daten per DVC holen
        run: uv run dvc pull

      - name: Pipeline ausführen (Validieren -> Trainieren -> Tracken)
        run: uv run python pipeline.py

      - name: Quality Gate prüfen
        run: uv run python quality_gate.py

      - name: Modell als @champion promoten
        run: uv run python promote_champion.py

      # Auf dem Self-hosted Runner nicht vorinstalliert wie bei ubuntu-latest
      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: In GHCR einloggen
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inference-Image neu bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
